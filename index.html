<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Craft & Doodle Portfolio — Nhật Ký Sáng Tạo & Kỹ Năng</title>
  <meta name="description" content="Portfolio cá nhân phong cách nghệ thuật thủ công giấy 2D kết hợp doodle sketch Kokuyo Stationery & Doodle Shooter.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Patrick+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <!-- 1. Mây & Mặt Trời Cố Định Đỉnh (Sticky Top Clouds) -->
  <div id="sticky-clouds-container"></div>

  <!-- 2. Sườn Minh Họa Cuộn Cảnh 2 Bên (Side Flanks) -->
  <div id="side-flanks-container"></div>

  <!-- 3. Khu vực Nội dung Scrapbook Chính -->
  <div id="app">
    <!-- Thanh thước kẻ chia vạch lọc kỹ năng (Stationery Ruler HUD) -->
    <div id="stationery-hud-container"></div>

    <!-- Dòng Sổ Tay Dự Án (Scrapbook Stream) -->
    <main id="scrapbook-stream-container" class="scrapbook-main-stream"></main>
  </div>

  <!-- 4. Bờ Biển & Sóng Cố Định Đáy (Sticky Bottom Beach) -->
  <div id="sticky-beach-container"></div>

  <!-- 5. Modal Sổ Tay Mở Rộng 2 Trang (Journal Spread Modal) -->
  <div id="journal-modal-container" class="journal-modal-container hidden" aria-hidden="true"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
